# ~/.tmux.conf
# Generated by configurator.fyi/tmux

# ─── General & behavior ──────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string "#S:#I #W"
setw -g automatic-rename off
set -g allow-rename off
set -g history-limit 50000

# ─── Key bindings ────────────────────────────
setw -g mode-keys vi
set -g status-keys vi
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind S setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# ─── Appearance ──────────────────────────────
set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e"
setw -g window-status-style "fg=#6c7086"
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right " %Y-%m-%d %H:%M "

# ─── Plugins (TPM) ───────────────────────────
# Install TPM once:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
