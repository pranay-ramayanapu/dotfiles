set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g status-position top

unbind C-b
set -g prefix C-b
bind-key C-b send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# # Alt+number to select window
# bind -n M-1 select-window -t 1
# bind -n M-2 select-window -t 2
# bind -n M-3 select-window -t 3
# bind -n M-4 select-window -t 4
# bind -n M-5 select-window -t 5
# bind -n M-6 select-window -t 6
# bind -n M-7 select-window -t 7
# bind -n M-8 select-window -t 8
# bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window


# Catppuccin Mocha theme colors
ctp_base="#1e1e2e"
ctp_mantle="#181825"
ctp_crust="#11111b"
ctp_text="#cdd6f4"
ctp_subtext1="#bac2de"
ctp_subtext0="#a6adc8"
ctp_overlay2="#9399b2"
ctp_overlay1="#7f849c"
ctp_overlay0="#6c7086"
ctp_surface2="#585b70"
ctp_surface1="#45475a"
ctp_surface0="#313244"
ctp_lavender="#b4befe"
ctp_blue="#89b4fa"
ctp_sapphire="#74c7ec"
ctp_sky="#89dceb"
ctp_teal="#94e2d5"
ctp_green="#a6e3a1"
ctp_yellow="#f9e2af"
ctp_peach="#fab387"
ctp_maroon="#eba0ac"
ctp_red="#f38ba8"
ctp_pink="#f5c2e7"
ctp_mauve="#cba6f7"
ctp_rosewater="#f5e0dc"
ctp_flamingo="#f2cdcd"

# Status bar
set -g status "on"
set -g status-bg "${ctp_base}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${ctp_lavender},bg=${ctp_surface0},align=centre"
set -g message-command-style "fg=${ctp_lavender},bg=${ctp_surface0},align=centre"

# Panes
set -g pane-border-style "fg=${ctp_surface1}"
set -g pane-active-border-style "fg=${ctp_lavender}"

# Windows
set -g window-status-activity-style "fg=${ctp_subtext0},bg=${ctp_base},none"
set -g window-status-separator ""
set -g window-status-style "fg=${ctp_subtext1},bg=${ctp_base},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${ctp_lavender},bg=${ctp_base}] #I: #[fg=${ctp_mauve},bg=${ctp_base}](✓) #[fg=${ctp_sapphire},bg=${ctp_base}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${ctp_mauve},bg=${ctp_base}]"

# Statusline - other windows
set -g window-status-format "#[fg=${ctp_lavender},bg=${ctp_base}] #I: #[fg=${ctp_text},bg=${ctp_base}]#W"

# Statusline - right side
set -g status-right "#[fg=${ctp_lavender},bg=${ctp_base},nobold,nounderscore,noitalics]#[fg=${ctp_base},bg=${ctp_lavender},nobold,nounderscore,noitalics] #[fg=${ctp_text},bg=${ctp_surface0}] #W #{?client_prefix,#[fg=${ctp_mauve}],#[fg=${ctp_sapphire}]}#[bg=${ctp_surface0}]#{?client_prefix,#[bg=${ctp_mauve}],#[bg=${ctp_sapphire}]}#[fg=${ctp_base}] #[fg=${ctp_text},bg=${ctp_surface0}] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${ctp_lavender}"
set -g mode-style "fg=${ctp_lavender} bg=${ctp_surface2} bold"
