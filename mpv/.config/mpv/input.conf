# VLC-style keyboard shortcuts

# Audio tracks
b cycle audio

# Subtitle tracks and visibility
v cycle sub
V cycle sub-visibility

# Seek backward / forward by 10 seconds
LEFT seek -10
RIGHT seek 10

# Volume down / up by 5%
DOWN add volume -5
UP add volume 5

# Keep common playback controls
SPACE cycle pause
f cycle fullscreen

# Subtitle delay
z add sub-delay -0.1
x add sub-delay 0.1
